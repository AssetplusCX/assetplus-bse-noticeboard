name: Refresh BSE StAR MF Notices

on:
  schedule:
    # Every 2 hours, 06:17-22:17 IST (00:47-16:47 UTC)
    - cron: "47 0,2,4,6,8,10,12,14,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Refresh BSE notices
        run: python scripts/refresh_notices.py

      - name: Refresh NSE notices
        run: python scripts/refresh_nse_notices.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: auto-refresh BSE & NSE MF notices $(date -u +%Y-%m-%d)"
            git push
          fi
